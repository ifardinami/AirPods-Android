name: Build AirPods APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run BLE parser self-test
        run: |
          mkdir -p /tmp/airpods-parser-test
          javac -d /tmp/airpods-parser-test app/src/main/java/com/airpods/manager/AirPodsBleParser.java tools/ParserSelfTest.java
          java -cp /tmp/airpods-parser-test ParserSelfTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AirPods.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirPods-Android-11
          path: AirPods.apk
          if-no-files-found: error
